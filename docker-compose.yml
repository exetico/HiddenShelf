services:
  web:
    build: .
    container_name: hiddenshelf
    ports:
      - "3000:3000"
    volumes:
      # Mount the db directory for persistence
      - ./db:/app/db
    environment:
      - PORT=3000
      - DB_PATH=./db/database.sqlite
      - SITE_URL=${SITE_URL:-http://localhost:3000}
      - SITE_NAME=${SITE_NAME:-Hidden Shelf}
      - SMTP_HOST=${SMTP_HOST:-mail.smtpbucket.com}
      - SMTP_PORT=${SMTP_PORT:-8025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_ENCRYPTION=${SMTP_ENCRYPTION:-}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@example.com}
      - FROM_NAME=${FROM_NAME:-Hidden Shelf}
      - DEBUG_MODE=${DEBUG_MODE:-true}
      - SIGNUP_ENABLED=${SIGNUP_ENABLED:-true}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/google/callback}
    restart: unless-stopped
    networks:
      - hiddenshelf-network

  frontend:
    image: node:20-alpine
    container_name: hiddenshelf-frontend
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://web:3000
      - VITE_BASE_PATH=${VITE_BASE_PATH:-/}
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./:/app
      - frontend-node-modules:/app/frontend/node_modules
    depends_on:
      - web
    networks:
      - hiddenshelf-network
    profiles:
      - dev

  frontend-build:
    image: node:20-alpine
    container_name: hiddenshelf-frontend-build
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run build"
    environment:
      - VITE_API_PROXY_TARGET=http://web:3000
      - VITE_BASE_PATH=${VITE_BASE_PATH:-/}
    volumes:
      - ./:/app
      - frontend-node-modules:/app/frontend/node_modules
    networks:
      - hiddenshelf-network
    profiles:
      - build

  frontend-test:
    image: node:20-alpine
    container_name: hiddenshelf-frontend-test
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run test -- --run"
    environment:
      - CI=true
    volumes:
      - ./:/app
      - frontend-node-modules:/app/frontend/node_modules
    networks:
      - hiddenshelf-network
    profiles:
      - test

  backend-test:
    image: node:20-alpine
    container_name: hiddenshelf-backend-test
    working_dir: /app/backend
    command: sh -c "apk add --no-cache python3 make g++ && npm ci && npm run test"
    environment:
      - CI=true
      - NODE_ENV=test
    volumes:
      - ./:/app
      - backend-node-modules:/app/backend/node_modules
    networks:
      - hiddenshelf-network
    profiles:
      - test

networks:
  hiddenshelf-network:
    driver: bridge

volumes:
  db-data:
  frontend-node-modules:
  backend-node-modules:
