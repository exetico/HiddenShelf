services:
  web:
    build: .
    container_name: hiddenshelf
    ports:
      - "8000:80"
    volumes:
      # Mount the db directory for persistence
      - ./db:/var/www/html/db
      # Mount config for easy updates (optional - comment out for production)
      - ./config.php:/var/www/html/config.php
    environment:
      - PHP_DISPLAY_ERRORS=On
      - PHP_ERROR_REPORTING=E_ALL
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/google-callback.php}
    restart: unless-stopped
    networks:
      - hiddenshelf-network

networks:
  hiddenshelf-network:
    driver: bridge

volumes:
  # Named volume for database persistence
  db-data:
