services:
  web:
    build: .
    container_name: hiddenshelf
    ports:
      - "8000:80"
    volumes:
      # Mount the db directory for persistence
      - ./db:/var/www/html/db
      # Mount config for easy updates (optional - comment out for production)
      - ./config.php:/var/www/html/config.php
    environment:
      - PHP_DISPLAY_ERRORS=On
      - PHP_ERROR_REPORTING=E_ALL
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/google-callback.php}
    restart: unless-stopped
    networks:
      - hiddenshelf-network

  frontend:
    image: node:20-alpine
    container_name: hiddenshelf-frontend
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://web
      - VITE_BASE_PATH=${VITE_BASE_PATH:-/}
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./:/app
      - frontend-node-modules:/app/frontend/node_modules
    depends_on:
      - web
    networks:
      - hiddenshelf-network
    profiles:
      - dev

  frontend-build:
    image: node:20-alpine
    container_name: hiddenshelf-frontend-build
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run build"
    environment:
      - VITE_API_PROXY_TARGET=http://web
      - VITE_BASE_PATH=${VITE_BASE_PATH:-/}
    volumes:
      - ./:/app
      - frontend-node-modules:/app/frontend/node_modules
    networks:
      - hiddenshelf-network
    profiles:
      - build

  frontend-test:
    image: node:20-alpine
    container_name: hiddenshelf-frontend-test
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run test -- --run"
    environment:
      - CI=true
    volumes:
      - ./:/app
      - frontend-node-modules:/app/frontend/node_modules
    networks:
      - hiddenshelf-network
    profiles:
      - test

networks:
  hiddenshelf-network:
    driver: bridge

volumes:
  # Named volume for database persistence
  db-data:
  frontend-node-modules:
