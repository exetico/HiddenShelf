<!DOCTYPE html>
<html lang="en" :class="theme">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - HiddenLinks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#f6f7f5",
                100: "#e3e6e1",
                200: "#c7cec4",
                300: "#a5af9e",
                400: "#8a9481",
                500: "#738562",
                600: "#5c6a4e",
                700: "#4a5540",
                800: "#3d4636",
                900: "#343b2f",
                950: "#1a1f18",
              },
            },
          },
        },
      };
    </script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body
    class="bg-gray-50 dark:bg-gray-900 min-h-screen flex items-center justify-center transition-colors"
  >
    <div x-data="loginApp()" x-init="init()" class="w-full max-w-md p-8">
      <div
        class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-8 transition-colors"
      >
        <div class="flex items-center justify-between mb-2">
          <h1 class="text-3xl font-bold text-gray-900 dark:text-white">
            HiddenLinks
          </h1>
          <button
            @click="toggleTheme()"
            class="p-2 text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white transition-colors"
            :title="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
          >
            <svg
              x-show="theme === 'light'"
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
              />
            </svg>
            <svg
              x-show="theme === 'dark'"
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>

        <!-- Welcome back message -->
        <div x-show="savedEmail && !showFullForm">
          <p class="text-gray-600 dark:text-gray-400 mb-6">Welcome back! 👋</p>

          <div
            class="bg-brand-50 dark:bg-brand-900/20 border border-brand-200 dark:border-brand-700 rounded-lg p-4 mb-6"
          >
            <p class="text-sm text-gray-700 dark:text-gray-300 mb-3">
              Continue as:
            </p>
            <p
              class="font-medium text-gray-900 dark:text-gray-100 mb-4 truncate"
              x-text="savedEmail"
              :title="savedEmail"
            ></p>

            <button
              @click="requestMagicLink()"
              :disabled="loading"
              class="w-full bg-brand-600 text-white py-2 px-4 rounded-md hover:bg-brand-700 disabled:bg-gray-400 dark:disabled:bg-gray-600 disabled:cursor-not-allowed transition mb-2"
            >
              <span x-show="!loading">Send Magic Link</span>
              <span x-show="loading">Sending...</span>
            </button>

            <button
              @click="showFullForm = true"
              class="w-full text-sm text-brand-600 dark:text-brand-400 hover:text-brand-700 dark:hover:text-brand-300 py-2"
            >
              Use a different email
            </button>

            <button
              @click="forgetEmail()"
              class="w-full text-sm text-red-600 dark:text-red-400 hover:text-red-700 dark:hover:text-red-300 py-2"
            >
              Forget this device
            </button>
          </div>
        </div>

        <!-- Regular login prompt -->
        <p
          x-show="!savedEmail || showFullForm"
          class="text-gray-600 dark:text-gray-400 mb-8"
        >
          Enter your email to receive a magic login link
        </p>

        <!-- Error message -->
        <div
          x-show="errorMessage"
          x-text="errorMessage"
          class="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-800 p-3 rounded-md mb-4"
        ></div>

        <!-- Success message -->
        <div
          x-show="successMessage"
          x-text="successMessage"
          class="bg-green-50 dark:bg-green-900/20 text-green-600 dark:text-green-400 border border-green-200 dark:border-green-800 p-3 rounded-md mb-4"
        ></div>

        <!-- Login form -->
        <form
          @submit.prevent="requestMagicLink()"
          x-show="(!savedEmail || showFullForm) && !successMessage"
        >
          <div class="mb-4">
            <label
              for="email"
              class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2"
            >
              Email Address
            </label>
            <input
              type="email"
              id="email"
              x-model="email"
              required
              class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-md focus:ring-2 focus:ring-brand-500 focus:border-transparent"
              placeholder="you@example.com"
              :disabled="loading"
            />
          </div>

          <button
            type="submit"
            :disabled="loading"
            class="w-full bg-brand-600 text-white py-2 px-4 rounded-md hover:bg-brand-700 disabled:bg-gray-400 dark:disabled:bg-gray-600 disabled:cursor-not-allowed transition"
          >
            <span x-show="!loading">Send Magic Link</span>
            <span x-show="loading">Sending...</span>
          </button>
        </form>

        <p class="text-xs text-gray-500 dark:text-gray-400 mt-6 text-center">
          No passwords required. We'll send you a secure login link via email.
        </p>
      </div>
    </div>

    <script>
      function loginApp() {
        return {
          theme: "light",
          email: "",
          savedEmail: "",
          showFullForm: false,
          loading: false,
          errorMessage: "",
          successMessage: "",

          toggleTheme() {
            this.theme = this.theme === "dark" ? "light" : "dark";
            localStorage.setItem("hiddenlinks_theme", this.theme);
          },

          initTheme() {
            const savedTheme = localStorage.getItem("hiddenlinks_theme");
            if (savedTheme) {
              this.theme = savedTheme;
            } else if (
              window.matchMedia("(prefers-color-scheme: dark)").matches
            ) {
              this.theme = "dark";
            }
          },

          init() {
            this.initTheme();

            // Check for error from URL
            const params = new URLSearchParams(window.location.search);
            const error = params.get("error");
            if (error) {
              this.errorMessage = error;
            }

            // Check for saved email
            const saved = localStorage.getItem("hiddenlinks_email");
            if (saved) {
              this.savedEmail = saved;
              this.email = saved;
            }
          },

          async requestMagicLink() {
            this.errorMessage = "";
            this.successMessage = "";
            this.loading = true;

            // Use savedEmail if we're in the welcome back flow
            const emailToUse =
              this.savedEmail && !this.showFullForm
                ? this.savedEmail
                : this.email;

            try {
              const response = await fetch("/api/auth.php?action=login", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  email: emailToUse,
                }),
              });

              const data = await response.json();

              if (data.success) {
                // Save email to localStorage
                localStorage.setItem("hiddenlinks_email", emailToUse);

                this.successMessage =
                  "Check your email! We sent you a magic login link.";
                this.email = "";
              } else {
                this.errorMessage = data.error || "Something went wrong";
              }
            } catch (error) {
              this.errorMessage = "Network error. Please try again.";
            } finally {
              this.loading = false;
            }
          },

          forgetEmail() {
            if (
              confirm(
                "This will remove your saved email from this device. Are you sure?"
              )
            ) {
              localStorage.removeItem("hiddenlinks_email");
              this.savedEmail = "";
              this.email = "";
              this.showFullForm = false;
            }
          },
        };
      }
    </script>
  </body>
</html>
