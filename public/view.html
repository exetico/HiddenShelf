<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Link - Hidden Shelf</title>
    <!-- Apple-specific meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Hidden Shelf" />
    <link rel="apple-touch-icon" href="/public/favicon.png" />
    <!-- Theme color for browser UI -->
    <meta name="theme-color" content="#687061" />
    <link rel="stylesheet" href="/public/output.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div x-data="viewApp()" x-init="init()">
      <div class="max-w-4xl mx-auto px-4 py-12">
        <!-- Redirecting State (Fixed Overlay) -->
        <div
          x-show="redirecting"
          class="fixed inset-0 bg-white bg-opacity-95 z-50 flex items-center justify-center"
        >
          <div class="text-center">
            <div class="inline-block mb-4">
              <svg
                class="animate-spin h-10 w-10 text-blue-600 mx-auto"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
            </div>
            <p class="text-gray-800 text-xl font-medium mb-2">Redirecting...</p>
            <p class="text-gray-500 text-sm max-w-md px-4">
              Taking you to
              <span
                class="font-mono text-xs bg-gray-100 px-2 py-1 rounded break-all"
                x-text="link?.url"
              ></span>
            </p>
            <p class="mt-6">
              <a
                href="#"
                @click.prevent="cancelRedirect()"
                class="text-gray-400 hover:text-gray-600 text-xs transition"
                >stay on page</a
              >
            </p>
          </div>
        </div>

        <!-- Loading State -->
        <div x-show="loading" class="text-center">
          <p class="text-gray-600">Loading...</p>
        </div>

        <!-- Error State -->
        <div x-show="error" class="bg-red-50 text-red-600 p-6 rounded-lg">
          <h2 class="text-xl font-bold mb-2">Error</h2>
          <p x-text="error"></p>
        </div>

        <!-- Link Display -->
        <div
          x-show="link && !loading && !error"
          class="bg-white rounded-lg shadow-md p-8"
        >
          <div class="mb-6">
            <div class="flex items-start justify-between mb-4">
              <h1
                class="text-3xl font-bold text-gray-900"
                x-text="link?.title"
              ></h1>
              <span
                class="px-3 py-1 bg-green-100 text-green-700 text-sm rounded-full"
              >
                Public Link
              </span>
            </div>

            <p
              class="text-gray-600 mb-6"
              x-text="link?.description || 'No description provided'"
            ></p>

            <div class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >URL:</label
              >
              <a
                :href="link?.url"
                target="_blank"
                class="text-blue-600 hover:underline break-all text-lg"
                x-text="link?.url"
              >
              </a>
            </div>

            <!-- Tags -->
            <div x-show="link?.tags && link.tags.length > 0" class="mb-6">
              <label class="block text-sm font-medium text-gray-700 mb-2"
                >Tags:</label
              >
              <div class="flex flex-wrap gap-2">
                <template x-for="tag in link?.tags" :key="tag.id">
                  <span
                    class="px-3 py-1 bg-gray-100 text-gray-700 text-sm rounded-full"
                    x-text="tag.name"
                  ></span>
                </template>
              </div>
            </div>

            <div class="pt-6 border-t border-gray-200">
              <a
                :href="link?.url"
                target="_blank"
                class="inline-block bg-blue-600 text-white px-6 py-3 rounded-md hover:bg-blue-700 transition"
              >
                Visit Link →
              </a>
            </div>
          </div>

          <div class="text-sm text-gray-500 border-t border-gray-200 pt-4">
            <p>Shared via Hidden Shelf</p>
            <p>Created: <span x-text="formatDate(link?.created_at)"></span></p>
          </div>
        </div>
      </div>
    </div>

    <script>
      function viewApp() {
        return {
          link: null,
          loading: true,
          redirecting: false,
          redirectTimer: null,
          stayOnPage: false,
          error: "",

          async init() {
            const params = new URLSearchParams(window.location.search);
            let hash = params.get("hash");

            // A "stay" param prevents direct redirect
            if (params.has("stay")) {
              this.stayOnPage = true;
            }

            // Also support /h/:hash URL format (used by short links)
            if (!hash) {
              const pathMatch =
                window.location.pathname.match(/\/h\/([a-zA-Z0-9]+)/);
              if (pathMatch) {
                hash = pathMatch[1];
              }
            }

            if (!hash) {
              this.error = "No link hash provided";
              this.loading = false;
              return;
            }

            await this.loadLink(hash);
          },

          async loadLink(hash) {
            try {
              const response = await fetch(
                `/api/links.php?hash=${encodeURIComponent(hash)}`,
              );
              const data = await response.json();

              if (data.success) {
                this.link = data.link;

                // Log the visit (fire and forget)
                this.logVisit(hash);

                // Check if direct redirect is enabled (skip if ?stay param present)
                if (
                  this.link.direct_redirect === 1 &&
                  this.link.url &&
                  !this.stayOnPage
                ) {
                  // Show redirecting state
                  this.loading = false;
                  this.redirecting = true;
                  // Delay so user can see the overlay and click "stay on page" if needed
                  this.redirectTimer = setTimeout(() => {
                    window.location.href = this.link.url;
                  }, 2000);
                  return;
                }
              } else {
                this.error = data.error || "Link not found or is private";
              }
            } catch (error) {
              this.error = "Failed to load link";
            } finally {
              if (!this.redirecting) {
                this.loading = false;
              }
            }
          },

          async logVisit(hash) {
            try {
              await fetch("/api/link_visits.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ hash }),
              });
            } catch (e) {
              // Silently fail - visit logging is optional
            }
          },

          cancelRedirect() {
            if (this.redirectTimer) {
              clearTimeout(this.redirectTimer);
              this.redirectTimer = null;
            }
            this.redirecting = false;
            this.loading = false;
          },

          formatDate(dateString) {
            if (!dateString) return "";
            const date = new Date(dateString);
            return date.toLocaleDateString("en-US", {
              year: "numeric",
              month: "long",
              day: "numeric",
            });
          },
        };
      }
    </script>
  </body>
</html>
